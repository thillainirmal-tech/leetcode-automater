name: Build and Release Assets

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pkg
        run: npm install -g pkg

      - name: Validate Problem Dataset
        run: npm run validate

      - name: Build Standalone Executable
        run: pkg ok.js --targets node18-win-x64 --output LeetcodeAutomater.exe

      - name: Zip Chrome Extension
        run: |
          cd LeetCode-Token-Viewer
          zip -r ../LeetCode-Token-Viewer.zip .

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeetcodeAutomater-exe
          path: LeetcodeAutomater.exe

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeetcodeAutomater-extension
          path: LeetCode-Token-Viewer.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: LeetCode Automater ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            LeetcodeAutomater.exe
            LeetCode-Token-Viewer.zip
